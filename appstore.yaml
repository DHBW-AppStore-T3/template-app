# App contract v2: the template app runs as pods (see the README).
apiVersion: appstore/v2
name: template-app
runtime: kubernetes
scope: team
workload:
  containers:
    - name: web
      image: ghcr.io/dhbw-appstore-t3/apps/template-app@sha256:18c6668461e8598729c402687d9f482a9f3862fb83ac6f22f369ac57db336051
      expose: { port: 8080, path: / }
      resources: { cpu: 200m, memory: 128Mi, requests: { cpu: 10m, memory: 32Mi } }
      writablePaths: [/tmp]
egress: none
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
