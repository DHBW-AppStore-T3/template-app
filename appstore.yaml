# App contract v2: the template app runs as pods (see the README).
apiVersion: appstore/v2
name: template-app
runtime: kubernetes
scope: team
workload:
  containers:
    - name: web
      image: ghcr.io/dhbw-appstore-t3/apps/template-app@sha256:55a326c02ebf967e641e90b7721a37977037c2006c5b34b1ee0e898cfbc8b556
      expose: { port: 8080, path: / }
      resources: { cpu: 200m, memory: 128Mi, requests: { cpu: 10m, memory: 32Mi } }
      writablePaths: [/tmp]
# What the pod may reach (the contract: app-registry README, "network"): a static page needs nothing, and an app copied
# from this template starts closed. Both settings are shown as examples of an app that offers a choice.
network:
  internet: { allowed: false, default: false }
  podNetwork: { allowed: true, default: false }
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
