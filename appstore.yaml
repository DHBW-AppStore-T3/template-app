# App contract v2: the template app runs as pods (see the Pod section of the README).
apiVersion: appstore/v2
name: template-app
runtime: kubernetes
scope: team
workload:
  containers:
    - name: web
      image: ghcr.io/dhbw-appstore-t3/apps/template-app@sha256:3f9ca22fe8dcedccbc13a11a035937c452f695e9ead9397c21e69fb73edc366a
      expose: { port: 8080, path: / }
      resources: { cpu: 200m, memory: 128Mi, requests: { cpu: 10m, memory: 32Mi } }
      writablePaths: [/tmp]
egress: none
access:
  - { type: url, template: "https://{workload}-{deployment}.{domain}" }
